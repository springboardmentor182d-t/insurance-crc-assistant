# A generic, single database configuration.

[alembic]
# path to migration scripts
script_location = alembic

# template used to generate migration files
# file_template = %%(rev)s_%%(slug)s

# sys.path path, will be prepended to sys.path if present.
# defaults to the current working directory.
prepend_sys_path = .

# timezone to use when rendering the date
# within the migration file as well as the filename.
# string value is passed to dateutil.tz.gettz()
# leave blank for localtime
# timezone =

# max length of characters to apply to the
# migration file section of the filename.
# revision_file_token_prefix =
# revision_environment_token_prefix =

# set to 'true' to remember revisions in the
# alembic_version table as they are applied.
# default is true.
revision_environment = false

# controls how many migrations will be applied when
# calling upgrade()
# default is all
# max_migrations = 999

# default is true
# compare_type = true

# default is false
# compare_server_default = false

# default is true
# warn_on_byterange = true

# default is true
# truncate_string_field = true

# default is false
# user_module_prefix =

# default is true
# sourceless = true

# default is false
# version_table = alembic_version

# default is false
# version_table_schema =

# default is false
# version_table_pk = true

# default is false
# version_locations =

# default is false
# version_path_separator = os

# default is false
# sourceless_errors = true

# default is false
# sqlalchemy_warn_20 = true

# default is false
# include_schemas = false

# default is false
# exclude_tables =

# default is false
# exclude_columns =

# default is false
# include_object =

# default is false
# exclude_object =

# default is false
# render_as_batch = true

sqlalchemy.url = postgresql://postgres:daksh29092004@localhost:5432/fraud_detection

# Logging configuration
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
